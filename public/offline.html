<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A1324" />
<title>Offline · AJSJ Leads</title>
<style>
  html,body{margin:0;height:100%;background:#0A1324;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
  img{height:120px}
  .rule{width:140px;height:1px;background:rgba(255,255,255,.25)}
  p{margin:0;color:rgba(255,255,255,.7);font-size:16px;line-height:1.5;max-width:280px}
  button{height:52px;padding:0 28px;border:0;border-radius:6px;background:#fff;color:#0A1324;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
</style>
</head>
<body>
<main>
  <img src="/ajsj-logo.png" alt="AJSJ Services LLC" onerror="this.outerHTML='<strong>AJSJ Services LLC</strong>'" />
  <div class="rule"></div>
  <p>No signal right now. Your leads will load as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
